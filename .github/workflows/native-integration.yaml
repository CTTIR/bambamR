name: native-integration
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-reads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            bioc::GenomicAlignments
            bioc::GenomicFeatures
            bioc::txdbmaker
            bioc::Rsamtools
            local::.
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minimap2 samtools subread hisat2 rna-star
      - name: Install package and verify synthetic reads
        env:
          BAMBAMR_REQUIRE_ALL_ALIGNERS: "true"
        run: |
          R CMD INSTALL .
          minimap2 --version
          samtools --version
          featureCounts -v
          Rscript --vanilla tools/verify-native.R "$RUNNER_TEMP/bambamR-native"
          Rscript --vanilla - <<'RSCRIPT'
          stopifnot(all(nzchar(Sys.which(c("minimap2", "samtools")))))
          library(bambamR)
          results <- as.data.frame(testthat::test_file(
            "tests/testthat/test-native-minimap2.R",
            reporter = "summary", stop_on_failure = TRUE
          ))
          stopifnot(nrow(results) > 0L, !any(results$skipped),
                    sum(results$passed) > 0L)
          RSCRIPT
