on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    uses: CTTIR/.github/.github/workflows/test-coverage.yaml@main
    with:
      # Report-only for now. The shared workflow computes coverage with covr
      # and an explicit exit rather than delegating the gate to Codecov;
      # set a real floor once this package is re-baselined.
      floor: 0
    secrets: inherit
